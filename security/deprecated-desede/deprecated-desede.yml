- id: deprecated-desede
  name: Inadequate Encryption Strength
  severity: error
  message: Triple DES (3DES or DESede) is considered deprecated. AES is the recommended cipher
  properties:
    precision: medium
    tags:
      - security
      - vulnerability
  patterns-either:
    - pattern: "(Cipher/getInstance #\"(?i)(?:DESede|TripleDES|TDEA)(?:WRAP|RFC3211WRAP|RFC3217WRAP)?(?:/.*/.*)?\")"
      interpret-regex?: true
    - pattern: "(javax.crypto.Cipher/getInstance #\"(?i)(?:DESede|TripleDES|TDEA)(?:WRAP|RFC3211WRAP|RFC3217WRAP)?(?:/.*/.*)?\")"
      interpret-regex?: true
